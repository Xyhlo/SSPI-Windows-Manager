<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SSPI Web Launcher</title>
  <style>
/* SSPI Windows palette and compact browser layout. */
*{box-sizing:border-box;-webkit-box-sizing:border-box}html,body{margin:0;min-height:100%;background:#0b0b0c;color:#ededed}
body{font:15px/1.55 "Geist","Segoe UI","Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
.sspi-header{height:64px;display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;-webkit-justify-content:space-between;justify-content:space-between;padding:0 28px;border-bottom:1px solid rgba(255,255,255,.08)}
.sspi-brand{display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;font-size:16px;color:#a0a0a6}.sspi-logo{display:block;width:36px;height:36px;object-fit:contain;margin-right:20px;transition:transform .18s ease;-webkit-transition:-webkit-transform .18s ease}.sspi-brand:hover .sspi-logo{transform:rotate(-8deg);-webkit-transform:rotate(-8deg)}.sspi-header-note{font:12px "Cascadia Mono",Consolas,monospace;color:#a0a0a6}
main{width:calc(100% - 56px);max-width:1320px;margin:28px auto;padding:0;position:relative;animation:sspi-enter .18s ease-out;-webkit-animation:sspi-enter .18s ease-out}
h1,h2,p{margin:0}h1{font-size:23px;line-height:1.3;letter-spacing:-.025em;font-weight:500;margin:0 0 8px}h2{font-size:18px;font-weight:500;line-height:1.4}.sspi-eyebrow{display:none}.sspi-description{color:#7a7a81;font-size:14px;max-width:760px;line-height:1.6}
button,a{font:inherit}button{cursor:pointer}button:focus,a:focus,[tabindex]:focus{outline:2px solid #e4e4e1!important;outline-offset:4px;box-shadow:none!important}button:disabled{opacity:.45;cursor:default}
.sspi-statusbar{display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;-webkit-flex-wrap:wrap;flex-wrap:wrap;min-height:41px;padding:4px 28px;background:#111113;border-bottom:1px solid rgba(255,255,255,.08);color:#7a7a81;font-size:12px}.sspi-statusbar>span{padding:5px 28px 5px 0}.sspi-statusbar strong{font-weight:400;color:#a0a0a6;margin-left:10px}.sspi-statusbar .sspi-ready{color:#97c4a2}.sspi-statusbar a{color:#ededed;margin-left:auto;padding:5px 0;text-decoration:none;border-bottom:1px solid #525258}
.sspi-section-label{font-size:13px;font-weight:400;color:#7a7a81;margin-bottom:12px}.sspi-log-panel{margin-top:25px}#logWrapper,#logContainer{font-family:"Cascadia Mono",Consolas,"Courier New",monospace;font-size:13px;line-height:1.7;word-wrap:break-word;overflow-wrap:break-word}
#logWrapper{height:calc(100vh - 340px);min-height:180px;overflow-y:auto;padding:15px 0;border-top:1px solid rgba(255,255,255,.08);border-bottom:1px solid rgba(255,255,255,.08);background:transparent}#logContainer{color:#a0a0a6}#logContainer .line{white-space:pre-wrap;margin-bottom:4px}#logContainer .info{color:#a0a0a6}#logContainer .success{color:#97c4a2}#logContainer .warning{color:#d8bd86}#logContainer .error,#logContainer.error{color:#e8a2a5}
[hidden]{display:none!important}.sspi-hint{color:#7a7a81;font-size:12px;margin-top:20px}.sspi-hint kbd{border:1px solid rgba(255,255,255,.12);border-radius:4px;padding:2px 6px;color:#a0a0a6;background:#161618}
::-webkit-scrollbar{width:7px}::-webkit-scrollbar-thumb{background:#333338;border-radius:5px}::-webkit-scrollbar-track{background:transparent}
@-webkit-keyframes sspi-enter{from{opacity:0;-webkit-transform:translateY(3px)}to{opacity:1;-webkit-transform:translateY(0)}}@keyframes sspi-enter{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:700px){.sspi-header{padding:0 18px}.sspi-statusbar{padding:5px 18px}.sspi-statusbar>span{padding-right:18px}.sspi-statusbar a{margin-left:0}main{width:calc(100% - 36px);margin:24px auto}h1{font-size:22px}#logContainer{font-size:12px}.sspi-header-note{font-size:11px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;-webkit-animation:none!important;transition:none!important;scroll-behavior:auto!important}}
#status{font-size:15px;color:#a0a0a6;margin-top:20px}.bad{color:#e8a2a5!important}
</style>
</head>

<body>
<header class="sspi-header"><div class="sspi-brand"><img class="sspi-logo" src="sspi-logo.png" alt="SSPI" /><span>Launcher</span></div><span class="sspi-header-note" id="consoleTag">PS5</span></header>
  <main>
    <h1>Opening SSPI</h1>
    <p id="status" role="status" aria-live="polite">Checking this console session&hellip;</p>
  </main>

  <script>
    (function () {
      'use strict';

      var dir = '[[APP_DIR_PLACEHOLDER]]';
      var version = '[[VERSION_PLACEHOLDER]]';
      var statusEl = document.getElementById('status');

      function fail() {
        statusEl.textContent = 'Cache incomplete - run the installer again.';
        statusEl.className = 'bad';
      }

      /* __complete__ is the LAST entry of the AppCache manifest, so if it is
         present (with our version content) every file before it was downloaded.
         Only then point at the app. If the marker is missing, this fetch falls
         back to this very page (content mismatch) or errors - never redirect
         into a partially cached directory. */
      function openCachedLauncher() {
        statusEl.textContent = 'Checking saved launcher files…';
        fetch('/app/' + dir + '/__complete__')
          .then(function (r) { return r.text(); })
          .then(function (text) {
            if (text.trim() === version) window.location.replace('/app/' + dir + '/index.html');
            else fail();
          })
          .catch(fail);
      }

      function sessionIsReady(value) {
        return !!value && value.edition === 'sspi-payload-manager' && value.protocol === 1 && value.ready === true &&
          value.jailbreak === 'active' && value.evidence === 'privileged-manager-process' &&
          value.launcherTitleId === 'WKAL00001' && typeof value.sessionId === 'string' && /^\d+-\d+-\d+$/.test(value.sessionId);
      }
      var firmware = /PlayStation 5\/(\d+\.\d+)/.exec(navigator.userAgent);
      document.getElementById('consoleTag').textContent = firmware ? 'PS5 / ' + firmware[1] : 'Browser / firmware unavailable';
      if (!firmware) { openCachedLauncher(); return; }
      function readJson(path, done) {
        var xhr = new XMLHttpRequest();
        var settled = false;
        var timeout;
        function finish(value, status, legacyUnsupported) {
          if (settled) return;
          settled = true;
          clearTimeout(timeout);
          done(value, status || 0, legacyUnsupported === true);
        }
        timeout = setTimeout(function () { finish(null); try { xhr.abort(); } catch (e) { } }, 1600);
        try {
          xhr.open('GET', 'http://127.0.0.1:8084/' + path + '?_=' + Date.now(), true);
          xhr.timeout = 1500;
          xhr.onload = function () {
            var value = null;
            try { if (xhr.status === 200) value = JSON.parse(xhr.responseText); } catch (e) { }
            finish(value, xhr.status, xhr.status === 200 && xhr.responseText.trim() === '404 Not Found');
          };
          xhr.onerror = xhr.ontimeout = function () { finish(null); };
          xhr.send();
        } catch (e) { finish(null); }
      }
      readJson('sspi/session', function (value, status, legacyUnsupported) {
        if (sessionIsReady(value)) {
          statusEl.textContent = 'Jailbreak active. Opening Payload Manager…';
          window.location.replace('http://127.0.0.1:8084/');
        } else if (status === 404 || status === 501 || legacyUnsupported) {
          // 2.23.1 also returned exact "404 Not Found" text with HTTP 200.
          readJson('sspi/identity', function (identity) {
            if (identity && identity.edition === 'sspi-payload-manager' && identity.protocol === 1 && identity.ready === true) {
              statusEl.textContent = 'Existing Payload Manager is ready. Opening…';
              window.location.replace('http://127.0.0.1:8084/');
            } else openCachedLauncher();
          });
        } else openCachedLauncher();
      });

    })();
  </script>
</body>

</html>
